<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Roedores</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="login-box">
        <h1>Iniciar sesión</h1>
        <form action="" method="post">
            <div class="user-box">
                <input type="text" placeholder="Nombre de usuario" required>
            </div>
            <div class="user-box">
                <input type="password" placeholder="Contraseña" id="contraseña" required>
            </div>

            <div>
                <button id="boton">Ver contraseña</button>
            </div>
            <a href=""><button>
                    Confirmar
                </button></a>
        </form>
    </div>
     <header class="cabecera">
            <div class="titulo1">
                <h1> <a href="index.html">OnView</a></h1>
            </div>
            <nav class="redirecciones">
                  <a class="btn1" href="avistamientos.html"><button>Avistamientos</button></a>
                <a class="btn1" href="comentarios.html"><button>Comentarios</button></a>
                <a class="btn1" href="reportes.html"><button>Reportes</button></a>
                <a class="btn1" href="Register.html"><button>Registrarse</button></a>
            </nav>
        </header>
    <script>
        const boton = document.querySelector("#boton");
        const contraseña = document.querySelector("#contraseña");
        const contraseña1 = document.querySelector("#contraseña1");

        boton.addEventListener("click", function () {
            event.preventDefault();


            if (contraseña.type === "password") {
                contraseña.type = "text";
            } else {
                contraseña.type = "password";
            }

            if (contraseña1.type === "password") {
                contraseña1.type = "text";
            } else {
                contraseña1.type = "password";
            }
        })
    </script>
</body>

</html>
