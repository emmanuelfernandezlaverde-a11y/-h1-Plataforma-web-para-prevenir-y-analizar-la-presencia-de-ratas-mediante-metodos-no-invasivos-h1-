<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnView - Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body><!-- Marca flotante (clicable para volver al inicio) -->
<a href="index.html" class="brand-floating">
    <div class="logo-badge">◉</div>
    <div class="brand-text">
        <span class="brand-title">OnView</span>
        <span class="brand-sub">I.E. San Antonio de Prado</span>
    </div>
</a>

<!-- Iluminación de fondo atmosférica -->
<div class="glow one"></div>
<div class="glow two"></div>

<!-- ==========================================================================
     CONTENIDO PRINCIPAL
     ========================================================================== -->
<main class="auth-main">

    <section class="hero">
        <span class="pill">
            <span class="pill-dot"></span>
            Acceso al sistema
        </span>
        <h1>Iniciar <span>sesión</span></h1>
        <p>Ingresa con tu cuenta institucional para registrar y consultar avistamientos en el plantel.</p>
    </section>

    <section class="card-clean auth-card">

        <form id="form-login" class="auth-form">

            <!-- Campo: Usuario -->
            <div class="form-group">
                <label for="usuario">Nombre de usuario <span class="required">*</span></label>
                <div class="input-wrap">
                    <span class="input-icon" aria-hidden="true">
                        <!-- Icono SVG: usuario -->
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input type="text" id="usuario" name="usuario" placeholder="Ej: juan.perez" required autocomplete="username">
                </div>
            </div>

            <!-- Campo: Contraseña -->
            <div class="form-group">
                <label for="password">Contraseña <span class="required">*</span></label>
                <div class="input-wrap">
                    <span class="input-icon" aria-hidden="true">
                        <!-- Icono SVG: candado -->
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password">

                    <button type="button" id="toggle-password" class="btn-toggle-pass" aria-label="Mostrar u ocultar contraseña">
                        <!-- Icono SVG: ojo abierto -->
                        <svg id="icon-eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <!-- Icono SVG: ojo cerrado (oculto por defecto) -->
                        <svg id="icon-eye-closed" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.79 19.79 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.79 19.79 0 0 1-3.16 4.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Opciones extra -->
            <div class="form-extra">
                <label class="remember">
                    <input type="checkbox" name="recordar">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="link-forgot">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón principal -->
            <button type="submit" class="btn-submit">
                <span>Confirmar</span>
                <span class="btn-arrow" aria-hidden="true">
                    <!-- Icono SVG: flecha derecha -->
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </span>
            </button>

            <!-- Enlace a registro -->
            <p class="auth-switch">
                ¿No tienes cuenta? <a href="Register.html">Regístrate aquí</a>
            </p>

            <!-- Mensaje de estado -->
            <div id="mensaje-login" class="alert-success hidden">
                <span class="alert-icon" aria-hidden="true">
                    <!-- Icono SVG: check -->
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </span>
                <div>
                    <strong>¡Inicio de sesión exitoso!</strong>
                    Bienvenido de vuelta a OnView.
                </div>
            </div>

        </form>
    </section>

</main>

<!-- ==========================================================================
     JAVASCRIPT: mostrar/ocultar contraseña + demo de envío
     ========================================================================== -->
<script>
    const toggleBtn   = document.querySelector("#toggle-password");
    const passInput   = document.querySelector("#password");
    const formLogin   = document.querySelector("#form-login");
    const mensaje     = document.querySelector("#mensaje-login");
    const eyeOpen     = document.querySelector("#icon-eye-open");
    const eyeClosed   = document.querySelector("#icon-eye-closed");

    // Mostrar / ocultar contraseña
    if (toggleBtn && passInput) {
        toggleBtn.addEventListener("click", function (e) {
            e.preventDefault();
            const isPassword = passInput.type === "password";
            passInput.type = isPassword ? "text" : "password";
            eyeOpen.style.display   = isPassword ? "none" : "block";
            eyeClosed.style.display = isPassword ? "block" : "none";
        });
    }

    // Envío de demostración (no recarga la página)
    if (formLogin) {
        formLogin.addEventListener("submit", function (e) {
            e.preventDefault();
            mensaje.classList.remove("hidden");
            mensaje.scrollIntoView({ behavior: "smooth", block: "nearest" });

            setTimeout(() => {
                formLogin.reset();
                passInput.type = "password";
                eyeOpen.style.display   = "block";
                eyeClosed.style.display = "none";
            }, 1600);
        });
    }
</script>

</body>
</html>
